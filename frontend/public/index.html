             crawlers and visitors without JavaScript. With JavaScript on, keep

        <!-- Default title (will be overridden by React Helmet) -->
       <title>Fidelis Logic | UAE IT Consulting & Modern Workplace Solutions</title>
        <meta name="description" content="Fidelis Logic helps UAE organizations plan, deploy, and support modern workplace technology including meeting rooms, workspace platforms, enterprise headsets, and business applications." />
        <!-- No canonical or og:url here: this file is served for every URL that
             has no pre-rendered page, so a fixed value would point them all at
             the home page. scripts/prerender-seo.mjs writes each route's own
             into its page at build time. -->
        <meta property="og:title" content="Fidelis Logic | UAE IT Consulting & Modern Workplace Solutions" />
        <meta property="og:description" content="Vendor-neutral UAE consulting for meeting rooms, workspace platforms, headsets, and business applications." />
        <meta property="og:type" content="website" />
        <!-- Static fallback preview. react-helmet sets a per-route og:image at
             runtime, but social crawlers (Facebook, LinkedIn, WhatsApp, Slack)
             do not execute JS — without this, shared links have no image.
             data-rh="true" hands these to react-helmet, which removes the tags
             it owns before writing its own; without it the runtime tag is
             *added* alongside this one and every non-home route ends up
             advertising two different og:images. -->
        <meta data-rh="true" property="og:image" content="https://fidelislogic.com/img/social/og-home.jpg" />
        <meta data-rh="true" property="og:image:width" content="1200" />
        <meta data-rh="true" property="og:image:height" content="630" />
        <meta data-rh="true" property="og:image:alt" content="A modern workplace with a Microsoft Teams Room display and open-plan desks" />
        <meta data-rh="true" name="twitter:card" content="summary_large_image" />
        <meta data-rh="true" name="twitter:image" content="https://fidelislogic.com/img/social/og-home.jpg" />
        
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>

                    corePlugins: { preflight: false },

                // Load Tailwind CDN
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
